<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Áries Cloud</title>
  
  <!-- Ligação ao Manifest do PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3A6987">
  
  <!-- Ícones do PWA e Apple -->
  <link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1yi8pB4-JAoOGDrgLKoNcLlvmaFrydBBc=w192">

  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #FAF6F0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    
    /* Iframe em tela cheia que carrega o Apps Script mantendo o URL do GitHub Pages */
    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Ecrã de carregamento elegante enquanto o iframe abre */
    #loading-screen {
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #E6EFF5 0%, #F8F4EE 50%, #EBF1F5 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      transition: opacity 0.5s ease;
    }

    #loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 45px;
      height: 45px;
      margin-top: 20px;
      border: 4px solid rgba(58, 105, 135, 0.15);
      border-radius: 50%;
      border-top-color: #3A6987;
      animation: girar 0.8s linear infinite;
    }

    @keyframes girar {
      to { transform: rotate(360deg); }
    }

    img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      filter: drop-shadow(0 10px 15px rgba(58, 105, 135, 0.2));
      animation: flutuar 3s ease-in-out infinite;
    }

    @keyframes flutuar {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <!-- Ecrã de Carregamento Inicial -->
  <div id="loading-screen">
    <img src="https://lh3.googleusercontent.com/d/1yi8pB4-JAoOGDrgLKoNcLlvmaFrydBBc" alt="Mascote Áries">
    <div class="spinner"></div>
    <p style="margin-top: 15px; color: #5C6E7E; font-weight: 600; font-size: 0.95rem;">A carregar Áries Cloud PWA...</p>
  </div>

  <!-- Iframe que mantém a URL do GitHub Pages ativa -->
  <iframe id="app-frame" src="https://script.google.com/a/macros/al.educacao.sp.gov.br/s/AKfycbxvmMFEhTAV1KngWf8urjmLgCrkDNiRj59E766pchWRxUdjvP4NVNPVUzymy9B6lQvoHA/exec" onload="esconderLoading()"></iframe>

  <script>
    // Registo do Service Worker para o PWA funcionar perfeitamente
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service Worker registado com sucesso!'))
        .catch((err) => console.log('Erro ao registar Service Worker:', err));
    }

    function esconderLoading() {
      const loader = document.getElementById('loading-screen');
      if (loader) {
        loader.classList.add('hidden');
      }
    }
  </script>

</body>
</html>
